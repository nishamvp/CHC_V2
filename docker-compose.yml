services:
  postgres:
    image: postgres:16
    container_name: chc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chc_v2
      POSTGRES_USER: chc_admin
      POSTGRES_PASSWORD: chc_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: